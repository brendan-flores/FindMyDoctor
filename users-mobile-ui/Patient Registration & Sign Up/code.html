<!-- Main Content Area -->

<!-- BEGIN: iOSStatusBar -->
<header class="w-full flex items-center justify-between pt-1 pb-4 select-none" data-purpose="status-bar">

</svg>

</div>

<!-- BEGIN: TitleHeader -->
<section class="mb-6" data-purpose="screen-title-section">
<h1 class="text-2xl sm:text-[28px] font-extrabold text-navy-900 tracking-tight">Create an Account</h1>
<p class="mt-1.5 text-sm text-slate-500 leading-snug">
          Join FindMyDoctor to book clinic appointments and track live queue passes.
        </p>
</section>

<!-- BEGIN: SignUpForm -->
<form class="space-y-4" data-purpose="registration-form" id="signUpForm" onsubmit="event.preventDefault();">
<!-- Full Name Field -->
<div>
<label class="block text-sm font-semibold text-navy-900 mb-1.5" for="fullName">Full Name</label>
<div class="relative flex items-center">
<span class="absolute left-4 text-slate-400 pointer-events-none flex items-center justify-center">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<input class="w-full bg-slate-50/70 border border-slate-200 text-slate-900 placeholder:text-slate-400 text-[15px] rounded-xl pl-11 pr-10 py-3.5 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-600 transition duration-150" id="fullName" name="fullName" placeholder="e.g. Juan Michael Reyes" required="" type="text" value="Juan Michael Reyes"/>
<!-- Valid Checkmark Indicator -->
<span class="absolute right-3.5 text-emerald-500 flex items-center">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
</div>
</div>
<!-- Email Address Field -->
<div>
<label class="block text-sm font-semibold text-navy-900 mb-1.5" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="absolute left-4 text-slate-400 pointer-events-none flex items-center">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<input class="w-full bg-slate-50/70 border border-slate-200 text-slate-900 placeholder:text-slate-400 text-[15px] rounded-xl pl-11 pr-10 py-3.5 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-600 transition duration-150" id="email" name="email" placeholder="Enter your email" required="" type="email" value="juan.reyes@gmail.com"/>
<!-- Valid Checkmark Indicator -->
<span class="absolute right-3.5 text-emerald-500 flex items-center">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
</div>
</div>
<!-- Mobile Number Field (Philippine format) -->
<div>
<div class="flex justify-between items-center mb-1.5">
<label class="block text-sm font-semibold text-navy-900" for="phone">Mobile Number</label>
<span class="text-xs font-medium text-slate-400">For SMS queue alerts</span>
</div>
<div class="relative flex items-center">
<!-- Philippine Flag & Country Code Pill -->
<div class="absolute left-3.5 flex items-center space-x-1.5 pr-2.5 border-r border-slate-200 pointer-events-none">
<span class="text-base leading-none">🇵🇭</span>
<span class="text-xs font-semibold text-slate-700">+63</span>
</div>
<input class="w-full bg-slate-50/70 border border-slate-200 text-slate-900 placeholder:text-slate-400 text-[15px] rounded-xl pl-24 pr-4 py-3.5 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-600 transition duration-150" id="phone" name="phone" placeholder="917 123 4567" type="tel" value="917 842 5591"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block text-sm font-semibold text-navy-900 mb-1.5" for="password">Password</label>
<div class="relative flex items-center">
<span class="absolute left-4 text-slate-400 pointer-events-none flex items-center">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<rect height="10" rx="2" stroke-linecap="round" stroke-linejoin="round" width="14" x="5" y="11"></rect>
<path d="M8 11V7a4 4 0 118 0v4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<input class="w-full bg-slate-50/70 border border-slate-200 text-slate-900 placeholder:text-slate-400 text-[15px] rounded-xl pl-11 pr-11 py-3.5 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-600 transition duration-150" id="password" name="password" placeholder="Create password (min. 8 characters)" required="" type="password" value="Mabuhay2024!"/>
<!-- Password Visibility Toggle Button -->
<button aria-label="Toggle password visibility" class="absolute right-3.5 text-slate-400 hover:text-slate-600 focus:outline-none p-1" data-purpose="password-visibility-toggle" id="togglePassword" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Password Requirement Pills / Realtime status -->
<div class="mt-2 flex flex-wrap gap-1.5" data-purpose="password-rules-indicator">
<span class="inline-flex items-center text-[11px] font-medium bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-full border border-emerald-200/60">
<svg class="w-3 h-3 mr-1 text-emerald-600" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"></path>
</svg>
              8+ chars
            </span>
<span class="inline-flex items-center text-[11px] font-medium bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-full border border-emerald-200/60">
<svg class="w-3 h-3 mr-1 text-emerald-600" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"></path>
</svg>
              1 number
            </span>
<span class="inline-flex items-center text-[11px] font-medium bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-full border border-emerald-200/60">
<svg class="w-3 h-3 mr-1 text-emerald-600" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"></path>
</svg>
              1 uppercase
            </span>
</div>
</div>
<!-- Confirm Password Field -->
<div>
<label class="block text-sm font-semibold text-navy-900 mb-1.5" for="confirmPassword">Confirm Password</label>
<div class="relative flex items-center">
<span class="absolute left-4 text-slate-400 pointer-events-none flex items-center">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<rect height="10" rx="2" stroke-linecap="round" stroke-linejoin="round" width="14" x="5" y="11"></rect>
<path d="M8 11V7a4 4 0 118 0v4" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M10 16l1.5 1.5 3-3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<input class="w-full bg-slate-50/70 border border-slate-200 text-slate-900 placeholder:text-slate-400 text-[15px] rounded-xl pl-11 pr-11 py-3.5 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-600 transition duration-150" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required="" type="password" value="Mabuhay2024!"/>
<button aria-label="Toggle confirm password visibility" class="absolute right-3.5 text-slate-400 hover:text-slate-600 focus:outline-none p-1" id="toggleConfirmPassword" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- Terms and Consent Checkbox -->
<div class="pt-1.5 pb-1">
<label class="flex items-start cursor-pointer group select-none">
<div class="relative flex items-center mt-0.5">
<input checked="" class="w-4 h-4 text-brand-700 bg-white border-slate-300 rounded focus:ring-brand-500/30 focus:ring-2 focus:ring-offset-0 transition cursor-pointer" id="terms" name="terms" type="checkbox"/>
</div>
<span class="ml-2.5 text-xs text-slate-600 leading-relaxed font-medium">
              I agree to FindMyDoctor's 
              <a class="text-brand-700 font-semibold hover:underline" href="#terms">Terms of Service</a> and 
              <a class="text-brand-700 font-semibold hover:underline" href="#privacy">Privacy Policy</a>, including Philippine Data Privacy Act compliance.
            </span>
</label>
</div>
<!-- Primary Call to Action Button -->
<div class="pt-3">
<button class="w-full h-13 py-3.5 px-6 rounded-xl bg-brand-700 hover:bg-brand-800 active:scale-[0.99] text-white font-bold text-[16px] tracking-wide flex items-center justify-center space-x-2 shadow-btn-primary transition duration-150 focus:outline-none focus:ring-4 focus:ring-brand-700/25" id="createAccountBtn" type="submit">
<span>Create Account</span>
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</form>
<!-- END: SignUpForm -->
</div>
<!-- BEGIN: BottomNavigationFooter -->
<footer class="w-full pb-3 pt-2 bg-white flex flex-col items-center select-none" data-purpose="bottom-navigation-area">
<!-- Alternate Login Redirect Link -->
<p class="text-sm font-medium text-slate-500 mb-4">
        Already have an account? 
        <a class="text-brand-700 font-bold hover:text-brand-800 transition duration-150" href="#login">Log In</a>
</p>
<!-- iOS Home Bar Indicator -->
<div class="w-32 h-1 bg-slate-300 rounded-full mb-1"></div>
</footer>
<!-- END: BottomNavigationFooter -->
</div>
<!-- END: MobileContainer -->
<!-- BEGIN: InteractiveHandlers -->
<script data-purpose="password-visibility">
    // Toggle main password input type
    const togglePasswordBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    if (togglePasswordBtn && passwordInput) {
      togglePasswordBtn.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
      });
    }

    // Toggle confirm password input type
    const toggleConfirmBtn = document.getElementById('toggleConfirmPassword');
    const confirmInput = document.getElementById('confirmPassword');

    if (toggleConfirmBtn && confirmInput) {
      toggleConfirmBtn.addEventListener('click', () => {
        const type = confirmInput.getAttribute('type') === 'password' ? 'text' : 'password';
        confirmInput.setAttribute('type', type);
      });
    }
  </script>
<!-- END: InteractiveHandlers -->
</body></html>
