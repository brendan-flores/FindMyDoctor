services:
  - type: web
    name: findmydoctor-backend
    env: node
    region: singapore
    plan: starter
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && node dist/index.js
    healthCheckPath: /health/modules
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: findmydoctor-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

databases:
  - name: findmydoctor-db
    databaseName: findmydoctor
    user: findmydoctor_user
    plan: free
