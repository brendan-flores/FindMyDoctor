<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FiDo - Registration Successful</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              navy: '#002B7F',
              primary: '#0948A4',
              hover: '#073B87',
              dark: '#0e1e38',
              muted: '#64748B',
              ringLight: '#E8F1FC',
              ringMedium: '#D5E5FA'
            }
          }
        }
      }
    }
  </script>
<style data-purpose="base-layout">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-0 sm:p-4">
<!-- BEGIN: MobileDeviceFrame -->
<main class="w-full max-w-[390px] min-h-[844px] h-[844px] bg-white flex flex-col justify-between items-center px-8 py-12 relative shadow-2xl sm:rounded-[44px] overflow-hidden" data-purpose="mobile-screen-container">
<!-- Top Spacer for iOS Safe Area / Vertical Balance -->
<div aria-hidden="true" class="w-full h-12"></div>
<!-- BEGIN: SuccessMessageContainer -->
<div class="flex flex-col items-center justify-center text-center -mt-6" data-purpose="success-status-block">
<!-- Concentric Circle Graphic with Checkmark -->
<div class="relative flex items-center justify-center mb-8" data-purpose="concentric-rings-badge">
<!-- Outer Concentric Circle -->
<div class="w-32 h-32 rounded-full bg-[#ECF3FD] flex items-center justify-center">
<!-- Middle Concentric Ring -->
<div class="w-24 h-24 rounded-full bg-[#DCEAFB] flex items-center justify-center ring-4 ring-[#E6F0FD]">
<!-- Inner Deep Blue Circle with White Checkmark -->
<div class="w-14 h-14 rounded-full bg-[#0A4EA6] flex items-center justify-center shadow-md">
<svg aria-hidden="true" class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewbox="0 0 24 24">
<polyline points="20 6 9 17 4 12"></polyline>
</svg>
</div>
</div>
</div>
</div>
<!-- Heading -->
<h1 class="text-[26px] leading-tight font-bold text-[#0F1E36] mb-3 tracking-tight">
        Registration<br/>Successful
      </h1>
<!-- Subtitle Description -->
<p class="text-sm leading-relaxed text-[#64748B] max-w-[260px] font-normal">
        Your healthcare journey with FiDo starts here. We're excited to help you manage your health better.
      </p>
</div>
<!-- END: SuccessMessageContainer -->
<!-- BEGIN: ActionButtonArea -->
<div class="w-full pb-8 flex justify-center" data-purpose="bottom-action-container">
<a class="w-full max-w-[190px] py-3.5 px-6 bg-[#0848A6] hover:bg-[#073B88] active:scale-[0.98] transition-all duration-150 rounded-full text-white font-semibold text-sm flex items-center justify-center gap-2 shadow-sm text-center" data-purpose="continue-button" href="#" role="button">
<span>Continue</span>
<svg class="w-4 h-4 transition-transform group-hover:translate-x-0.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<line x1="5" x2="19" y1="12" y2="12"></line>
<polyline points="12 5 19 12 12 19"></polyline>
</svg>
</a>
</div>
<!-- END: ActionButtonArea -->
</main>
<!-- END: MobileDeviceFrame -->
</body></html>
