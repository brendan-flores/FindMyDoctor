<!DOCTYPE html><html lang="en" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "tertiary-container": "#00ae9d", "surface-bright": "#f8f9ff", "surface-container-low": "#eff4ff", "on-primary": "#ffffff", "surface-container": "#e5eeff", "on-secondary-fixed-variant": "#3f465c", "outline": "#6e7881", "tertiary-fixed-dim": "#4fdbc8", "on-tertiary-container": "#003a33", "surface": "#f8f9ff", "secondary-fixed-dim": "#bec6e0", "primary-container": "#0ea5e9", "inverse-on-surface": "#eaf1ff", "secondary-container": "#dae2fd", "primary": "#006591", "error": "#ba1a1a", "surface-tint": "#006591", "surface-container-high": "#dce9ff", "secondary-fixed": "#dae2fd", "on-background": "#0b1c30", "surface-container-highest": "#d3e4fe", "outline-variant": "#bec8d2", "on-surface": "#0b1c30", "on-primary-fixed": "#001e2f", "on-secondary-fixed": "#131b2e", "primary-fixed-dim": "#89ceff", "on-error-container": "#93000a", "inverse-primary": "#89ceff", "on-tertiary": "#ffffff", "on-surface-variant": "#3e4850", "on-error": "#ffffff", "on-primary-container": "#003751", "on-tertiary-fixed-variant": "#005048", "background": "#f8f9ff", "tertiary-fixed": "#71f8e4", "on-secondary-container": "#5c647a", "secondary": "#565e74", "tertiary": "#006b5f", "error-container": "#ffdad6", "on-secondary": "#ffffff", "on-tertiary-fixed": "#00201c", "primary-fixed": "#c9e6ff", "on-primary-fixed-variant": "#004c6e", "surface-variant": "#d3e4fe", "surface-dim": "#cbdbf5", "surface-container-lowest": "#ffffff", "inverse-surface": "#213145" }, borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" }, spacing: { "gutter-sm": "0.5rem", "gutter-2xl": "1.5rem", "gutter-xs": "0.25rem", "gutter-xl": "1.25rem", "gutter-3xl": "2rem", "safe-margin": "1rem", "gutter-md": "0.75rem", "touch-target": "3rem", "gutter-lg": "1rem" }, fontFamily: { "headline-md": ["Plus Jakarta Sans"], "body-md-medium": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "body-lg-medium": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "queue-num": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"] }, fontSize: { "headline-md": ["22px", { lineHeight: "28px", fontWeight: "700" }], "body-md-medium": ["14px", { lineHeight: "20px", fontWeight: "500" }], "headline-lg": ["28px", { lineHeight: "36px", fontWeight: "700" }], "label-sm": ["11px", { lineHeight: "14px", letterSpacing: "0.04em", fontWeight: "700" }], "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }], "body-lg-medium": ["16px", { lineHeight: "24px", fontWeight: "500" }], "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }], "headline-sm": ["18px", { lineHeight: "24px", fontWeight: "600" }], "queue-num": ["32px", { lineHeight: "36px", fontWeight: "800" }], "label-md": ["13px", { lineHeight: "16px", fontWeight: "600" }] } } } };</script></head><body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface px-safe-margin"><div class="flex flex-col w-full pb-6"><div class="flex flex-col items-center text-center mt-6 mb-8"><div class="w-16 h-16 rounded-2xl bg-surface-container flex items-center justify-center text-primary mb-6 shadow-sm"><span class="material-symbols-outlined text-[32px]">lock_reset</span></div><h2 class="font-headline-md text-headline-md text-on-surface tracking-tight">Forgot Password?</h2><p class="font-body-md text-body-md text-on-surface-variant max-w-[320px] mt-2">Enter your email address and we'll send you a link to reset your password.</p></div><div class="w-full bg-surface-container-lowest rounded-2xl p-6 shadow-sm"><form class="space-y-5" onsubmit="event.preventDefault(); alert('Reset link sent!');"><div class="space-y-1.5"><label class="block font-label-md text-label-md text-on-surface" for="email-input">Email Address</label><div class="relative flex items-center rounded-xl bg-surface-container-low transition-all duration-150 focus-within:bg-surface-container-lowest focus-within:shadow-md"><div class="absolute left-3.5 flex items-center justify-center pointer-events-none text-outline"><span class="material-symbols-outlined text-[20px]">mail</span></div><input class="w-full h-12 pl-11 pr-4 bg-transparent text-on-surface placeholder:text-outline font-body-md text-body-md outline-none rounded-xl" id="email-input" name="email" placeholder="name@example.com" required="" type="email"></div></div><button class="w-full h-12 px-6 rounded-xl text-on-primary font-headline-sm text-headline-sm flex items-center justify-center gap-2 shadow-md shadow-primary/25 active:scale-[0.99] transition-all hover:opacity-95" style="background-color: rgb(0, 82, 204);" type="submit"><span class="">Send Reset Link</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span></button></form></div><div class="text-center mt-8"><p class="font-body-md text-body-md text-on-surface-variant">Remember your password?<a class="font-label-md text-label-md text-primary font-bold ml-1 hover:underline inline-flex items-center gap-0.5" href="#" onclick="history.back(); return false;"><span class="">Log In</span></a></p></div></div>
<script>
  let currentMethod = 'email';

  function switchMethod(method) {
    currentMethod = method;
    const tabEmail = document.getElementById('tab-email');
    const tabPhone = document.getElementById('tab-phone');
    const input = document.getElementById('identifier-input');
    const label = document.getElementById('input-label');
    const icon = document.getElementById('field-icon');
    const clearBtn = document.getElementById('clear-btn');

    input.value = '';
    clearBtn.classList.add('hidden');

    if (method === 'email') {
      tabEmail.className = 'py-2 px-3 rounded-lg text-center font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-xs flex items-center justify-center gap-1.5';
      tabPhone.className = 'py-2 px-3 rounded-lg text-center font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface flex items-center justify-center gap-1.5';
      label.innerText = 'Registered Email Address';
      input.placeholder = 'e.g. juan.delacruz@gmail.com';
      input.type = 'email';
      input.setAttribute('inputmode', 'email');
      icon.innerText = 'alternate_email';
    } else {
      tabPhone.className = 'py-2 px-3 rounded-lg text-center font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-xs flex items-center justify-center gap-1.5';
      tabEmail.className = 'py-2 px-3 rounded-lg text-center font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface flex items-center justify-center gap-1.5';
      label.innerText = 'PH Mobile Number (+63)';
      input.placeholder = 'e.g. 0917 123 4567';
      input.type = 'tel';
      input.setAttribute('inputmode', 'numeric');
      icon.innerText = 'phone_iphone';
    }
    input.focus();
  }

  function validateInput(val) {
    const clearBtn = document.getElementById('clear-btn');
    if (val && val.length > 0) {
      clearBtn.classList.remove('hidden');
    } else {
      clearBtn.classList.add('hidden');
    }
  }

  function clearInputField() {
    const input = document.getElementById('identifier-input');
    input.value = '';
    input.focus();
    validateInput('');
  }

  function handleSendCode(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-button');
    const btnText = document.getElementById('button-text');
    const btnIcon = document.getElementById('button-icon');
    const input = document.getElementById('identifier-input');

    if (!input.value.trim()) return;

    btn.disabled = true;
    btn.classList.add('opacity-80', 'cursor-not-allowed');
    btnText.innerText = 'Sending Code...';
    btnIcon.innerText = 'progress_activity';
    btnIcon.classList.add('animate-spin');

    setTimeout(() => {
      btnText.innerText = 'Code Sent!';
      btnIcon.classList.remove('animate-spin');
      btnIcon.innerText = 'check_circle';
      btn.classList.remove('bg-primary');
      btn.classList.add('bg-tertiary', 'text-on-tertiary');

      setTimeout(() => {
        // Mock progression to next OTP screen (SCREEN_14 / SCREEN_32)
        alert('Reset code dispatched to ' + input.value + '. Navigating to OTP verification screen.');
        btn.disabled = false;
        btn.classList.remove('opacity-80', 'cursor-not-allowed', 'bg-tertiary', 'text-on-tertiary');
        btn.classList.add('bg-primary');
        btnText.innerText = 'Send Verification Code';
        btnIcon.innerText = 'arrow_forward';
      }, 900);
    }, 1100);
  }
</script></main>

</body></html>
