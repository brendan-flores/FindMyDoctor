<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>FiDo - Book appointments easily</title>
<!-- Tailwind CSS v3 CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind configuration for exact theme colors -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f5ff',
              100: '#e0ecff',
              200: '#c5dcff',
              600: '#1558d6',
              700: '#0e4ebd',
              800: '#0a3d99',
              900: '#0b327b',
              navy: '#0c2340',
            }
          }
        }
      }
    };
  </script>
<!-- Component custom styles -->
<style data-purpose="custom-styling">
    /* Custom font styling and subtle anti-aliasing */
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 flex justify-center items-center min-h-screen p-0 sm:p-4">
<!-- BEGIN: MobileDeviceContainer -->
<!-- Constrained mobile iOS container (approx 390px typical iPhone width) -->
<main class="w-full max-w-[390px] h-[844px] bg-white rounded-[44px] shadow-2xl overflow-hidden flex flex-col justify-between relative border border-slate-100 select-none">
<!-- BEGIN: HeaderSection -->
<header class="pt-8 px-8 flex justify-end items-center z-10">
<!-- Skip action link -->
<a class="text-sm font-medium text-slate-500 hover:text-brand-900 transition-colors py-2 px-1" data-purpose="skip-button" href="#skip">
        Skip
      </a>
</header>
<!-- END: HeaderSection -->
<!-- BEGIN: CenterContentSection -->
<!-- Centered illustration and promotional messaging -->
<section class="flex-1 flex flex-col items-center justify-center px-6 -mt-4 text-center">
<!-- Concentric circular badge illustration -->
<div class="relative flex items-center justify-center mb-10" data-purpose="illustration-wrapper">
<!-- Outer subtle ring -->
<div class="w-56 h-56 rounded-full bg-blue-50/70 flex items-center justify-center">
<!-- Inner soft halo ring -->
<div class="w-44 h-44 rounded-full bg-blue-100/60 flex items-center justify-center">
<!-- Central rounded square solid blue icon container -->
<div class="w-20 h-20 bg-brand-700 rounded-[22px] flex items-center justify-center shadow-lg shadow-blue-500/20">
<!-- Calendar / schedule icon -->
<svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<!-- Outer calendar frame -->
<rect height="18" rx="2" ry="2" width="18" x="3" y="4"></rect>
<!-- Top binder rings -->
<line x1="16" x2="16" y1="2" y2="6"></line>
<line x1="8" x2="8" y1="2" y2="6"></line>
<!-- Calendar header divider line -->
<line x1="3" x2="21" y1="10" y2="10"></line>
<!-- Schedule date dots (2x3 grid) -->
<circle cx="8" cy="14" fill="currentColor" r="0.75" stroke="none"></circle>
<circle cx="12" cy="14" fill="currentColor" r="0.75" stroke="none"></circle>
<circle cx="16" cy="14" fill="currentColor" r="0.75" stroke="none"></circle>
<circle cx="8" cy="18" fill="currentColor" r="0.75" stroke="none"></circle>
<circle cx="12" cy="18" fill="currentColor" r="0.75" stroke="none"></circle>
<circle cx="16" cy="18" fill="currentColor" r="0.75" stroke="none"></circle>
</svg>
</div>
</div>
</div>
</div>
<!-- Heading -->
<h1 class="text-[26px] font-bold tracking-tight text-brand-900 leading-tight mb-3">
        Book appointments<br/>easily
      </h1>
<!-- Subtitle description -->
<p class="text-[14px] text-slate-500 font-normal leading-relaxed max-w-[260px] mx-auto">
        Real-time availability at your fingertips.<br/>No more phone calls.
      </p>
</section>
<!-- END: CenterContentSection -->
<!-- BEGIN: BottomActionSection -->
<footer class="pb-12 px-8 flex flex-col items-center gap-6">
<!-- Primary next button -->
<button class="w-full py-3.5 bg-brand-700 hover:bg-brand-800 active:scale-[0.99] text-white text-base font-medium rounded-full shadow-md shadow-brand-700/25 flex items-center justify-center transition-all duration-150" data-purpose="next-step-button" type="button">
<span>Next</span>
<!-- Arrow right icon -->
<svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<line x1="5" x2="19" y1="12" y2="12"></line>
<polyline points="12 5 19 12 12 19"></polyline>
</svg>
</button>
<!-- Pagination dots -->
<!-- Screen 3 of 3: first two dots inactive (light blue/grey), third dot active (elongated or primary deep blue) -->
<nav aria-label="Onboarding Progress" class="flex items-center justify-center space-x-2" data-purpose="pagination-indicator">
<!-- Dot 1: Inactive -->
<span class="w-2 h-2 rounded-full bg-slate-200"></span>
<!-- Dot 2: Inactive -->
<span class="w-2 h-2 rounded-full bg-slate-200"></span>
<!-- Dot 3: Active Indicator -->
<span class="w-5 h-2 rounded-full bg-brand-700"></span>
</nav>
</footer>
<!-- END: BottomActionSection -->
</main>
<!-- END: MobileDeviceContainer -->
</body></html>
