<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>FiDo - Find the right doctor</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              navy: '#0A3B8C',
              primary: '#0B47A8',
              hover: '#093b8d',
              ringInner: '#DFECFB',
              ringOuter: '#EEF5FC',
            }
          }
        }
      }
    }
  </script>
<style data-purpose="base-layout">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .safe-top {
      padding-top: env(safe-area-inset-top, 20px);
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen antialiased p-0 sm:p-4">
<!-- BEGIN: MobileContainer -->
<!-- Mobile frame representing iPhone standard viewport (~390px) -->
<main class="w-full max-w-[390px] h-[844px] max-h-screen bg-white shadow-2xl flex flex-col justify-between relative overflow-hidden sm:rounded-[44px]">
<!-- BEGIN: TopBar -->
<!-- Top Bar with Safe Area and Skip Action -->
<header class="safe-top pt-5 px-7 flex justify-end items-center w-full z-10">
<button class="text-sm font-medium text-slate-500 hover:text-slate-800 transition-colors py-2 px-1 focus:outline-none" data-purpose="skip-button" type="button">
        Skip
      </button>
</header>
<!-- END: TopBar -->
<!-- BEGIN: HeroSection -->
<!-- Center Graphic and Informational Text -->
<section class="flex-1 flex flex-col items-center justify-center px-6 -mt-8" data-purpose="onboarding-content">
<!-- Graphic Illustration with Concentric Subtle Rings -->
<div class="relative flex items-center justify-center mb-10" data-purpose="illustration-badge">
<!-- Outer diffuse concentric circle -->
<div class="w-56 h-56 rounded-full bg-[#F2F7FD] flex items-center justify-center">
<!-- Inner concentric circle -->
<div class="w-44 h-44 rounded-full bg-[#E3EEFA] flex items-center justify-center shadow-inner">
<!-- Solid Blue Rounded Square Badge -->
<div class="w-20 h-20 rounded-[22px] bg-[#0A58CA] flex items-center justify-center shadow-lg shadow-blue-500/25">
<!-- Doctor search icon (Doctor silhouette + Magnifying glass) -->
<svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<!-- User / Person outline -->
<circle cx="9.5" cy="7.5" fill="none" r="3.5" stroke="currentColor"></circle>
<path d="M4 19c0-3 2.5-5.5 6-5.5" stroke="currentColor"></path>
<!-- Magnifying search glass attached -->
<circle cx="15.5" cy="15.5" fill="none" r="3.2" stroke="currentColor"></circle>
<path d="M18 18l3.2 3.2" stroke="currentColor" stroke-width="2.5"></path>
</svg>
</div>
</div>
</div>
</div>
<!-- Main Headline -->
<h1 class="text-[26px] leading-tight font-bold text-[#0B2545] tracking-tight text-center mb-3">
        Find the right doctor
      </h1>
<!-- Subtitle Description -->
<p class="text-[14px] leading-relaxed text-slate-500 font-normal text-center max-w-[250px]">
        Search for specialists based on location, availability, and symptoms.
      </p>
</section>
<!-- END: HeroSection -->
<!-- BEGIN: BottomControls -->
<!-- Action Button and Pagination Indicator -->
<footer class="safe-bottom pb-9 px-7 flex flex-col items-center gap-5 w-full">
<!-- Primary Action: Next Button -->
<button class="w-full h-13 py-3.5 bg-[#0A54C2] hover:bg-[#08439B] active:scale-[0.99] transition-all duration-150 rounded-full text-white font-semibold text-[15px] flex items-center justify-center gap-2 shadow-md shadow-blue-600/20" data-purpose="next-step-button" type="button">
<span>Next</span>
<svg class="w-4 h-4 translate-y-[0.5px]" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Pagination Indicators: Screen 1 active -->
<nav aria-label="Onboarding Progress" class="flex items-center justify-center gap-1.5 py-1">
<!-- Active Dot (Screen 1) -->
<span class="w-6 h-1.5 bg-[#0A54C2] rounded-full transition-all duration-200"></span>
<!-- Inactive Dot (Screen 2) -->
<span class="w-1.5 h-1.5 bg-slate-300 rounded-full"></span>
<!-- Inactive Dot (Screen 3) -->
<span class="w-1.5 h-1.5 bg-slate-300 rounded-full"></span>
</nav>
</footer>
<!-- END: BottomControls -->
</main>
<!-- END: MobileContainer -->
</body></html>
